<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SportyBet Slip Optimizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07130d;
      color: #ffffff;
    }

    .app {
      max-width: 620px;
      margin: auto;
      padding: 20px 15px 35px;
    }

    /* HEADER */

    .header {
      text-align: center;
      padding: 25px 5px 30px;
    }

    .ball {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header h1 span {
      color: #20c777;
    }

    .header p {
      color: #9aa89f;
      font-size: 14px;
      line-height: 1.5;
      margin: 10px auto 0;
      max-width: 430px;
    }

    /* MAIN CARD */

    .card {
      background: #102019;
      border: 1px solid #1d382b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .card-text {
      color: #94a39a;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* INPUT */

    input {
      width: 100%;
      height: 55px;
      border: 1px solid #31513f;
      border-radius: 10px;
      background: #07130d;
      color: #ffffff;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: #20c777;
    }

    input::placeholder {
      color: #526158;
      font-size: 15px;
      letter-spacing: 1px;
    }

    /* BUTTON */

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .green {
      background: #20c777;
      color: #06120b;
    }

    .green:hover {
      background: #27d681;
    }

    .dark-button {
      background: #1b3026;
      color: white;
      border: 1px solid #31513f;
    }

    /* LOADING */

    .loading {
      display: none;
      text-align: center;
      color: #8fa198;
      font-size: 13px;
      padding-top: 14px;
    }

    /* ERROR */

    .error {
      display: none;
      background: #35171d;
      border: 1px solid #66303a;
      color: #ffb7c0;
      padding: 12px;
      border-radius: 9px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    /* SLIP */

    .slip-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #07130d;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .slip-code {
      color: #20c777;
      font-weight: bold;
    }

    .count {
      color: #9aa89f;
      font-size: 12px;
    }

    /* SELECTION */

    .selection {
      background: #0a1710;
      border-left: 3px solid #20c777;
      border-radius: 8px;
      padding: 12px;
      margin-top: 9px;
    }

    .event {
      font-weight: bold;
      font-size: 14px;
      line-height: 1.4;
    }

    .market {
      color: #7f9187;
      font-size: 12px;
      margin-top: 5px;
    }

    .pick {
      color: #20c777;
      font-size: 13px;
      font-weight: bold;
      margin-top: 7px;
    }

    .odds {
      color: white;
      font-size: 12px;
      margin-top: 5px;
    }

    /* RESULTS */

    .profile {
      border: 1px solid #263f32;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      background: #0a1710;
    }

    .profile-name {
      font-size: 18px;
      font-weight: bold;
      color: #20c777;
    }

    .profile-description {
      color: #8d9d94;
      font-size: 12px;
      line-height: 1.5;
      margin: 6px 0 12px;
    }

    .result-pick {
      border-top: 1px solid #1b3026;
      padding: 10px 0;
      font-size: 13px;
      line-height: 1.4;
    }

    .result-pick strong {
      color: white;
    }

    .result-choice {
      color: #20c777;
      font-weight: bold;
      margin-top: 4px;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      color: #607067;
      font-size: 11px;
      line-height: 1.5;
