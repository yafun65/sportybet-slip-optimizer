<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportyBet Slip Optimizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aab4c5;
      margin-bottom: 25px;
    }

    .card {
      background: #151f32;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
      font-size: 19px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #34415a;
      background: #0d1524;
      color: white;
      resize: vertical;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #20c77a;
      color: #06130d;
    }

    .secondary {
      background: #26344c;
      color: white;
    }

    .selection {
      background: #0d1524;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      border-left: 3px solid #20c77a;
    }

    .profile {
      background: #0d1524;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .profile h3 {
      margin-top: 0;
    }

    .pick {
      padding: 10px 0;
      border-bottom: 1px solid #27344a;
    }

    .pick:last-child {
      border-bottom: none;
    }

    .error {
      background: #451d27;
      color: #ffb8c2;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 15px;
      color: #aab4c5;
    }

    .notice {
      color: #9eabc0;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>⚽ SportyBet Slip Optimizer</h1>

  <div class="subtitle">
    Extract your selections and create lower-variance, balanced and higher-variance alternatives.
  </div>

  <div class="card">

    <h2>1. Paste your SportyBet slip</h2>

    <p style="color:#aab4c5;">
      Open your SportyBet slip, copy the slip details and paste them below.
    </p>

    <textarea
      id="slipText"
      placeholder="Paste your SportyBet slip details here..."
    ></textarea>

    <button class="primary" onclick="extractSlip()">
      Extract Selections
    </button>

    <div id="loadingExtract" class="loading">
      Extracting selections...
    </div>

    <div id="error" class="error"></div>

  </div>
