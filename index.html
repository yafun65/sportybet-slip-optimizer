<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SportyBet Slip Optimizer</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, #123d2c 0%, transparent 35%),
        radial-gradient(circle at bottom left, #13243c 0%, transparent 35%),
        #07110d;
      color: #ffffff;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 18px;
    }

    /* HEADER */

    .header {
      text-align: center;
      padding: 25px 10px 20px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 22px;
      background: linear-gradient(135deg, #20d17b, #0b7d49);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      box-shadow: 0 15px 40px rgba(32, 209, 123, 0.25);
    }

    .header h1 {
      margin: 16px 0 8px;
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .header p {
      margin: 0;
      color: #a8b6ad;
      line-height: 1.5;
      font-size: 15px;
    }

    /* CARD */

    .card {
      background: rgba(17, 29, 23, 0.88);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.22);
      backdrop-filter: blur(10px);
    }

    /* STEP */

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 17px;
    }

    .step-number {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #20d17b;
      color: #06130c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .step-title {
      font-size: 18px;
      font-weight: 800;
    }

    .helper {
      color: #91a097;
      font-size: 13px;
      line-height: 1.5;
      margin: -5px 0 15px 46px;
    }

    /* INPUT */

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 58px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid #30463a;
      background: #09140e;
      color: white;
      font-size: 21px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #20d17b;
      box-shadow: 0 0 0 3px rgba(32,209,123,0.12);
    }

    input::placeholder {
      color: #526159;
      letter-spacing: 1px;
      font-size: 16px;
    }

    /* BUTTON */

    button {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 14px;
      margin-top: 13px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      background: linear-gradient(135deg, #25df83, #16ad62);
      color: #041109;
      box-shadow: 0 10px 25px rgba(32,209,123,0.18);
    }

    .secondary {
      background: #1b2b23;
      color: white;
      border: 1px solid #30463a;
    }

    /* LOADING */

    .loading {
      display: none;
      text-align: center;
      padding: 18px 5px 4px;
      color: #9daea4;
      font-size: 14px;
    }

    .loader {
      width: 25px;
      height: 25px;
      border: 3px solid #294036;
      border-top-color: #20d17b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: auto auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR */

    .error {
      display: none;
      margin-top: 13px;
      padding: 13px;
      border-radius: 12px;
      background: rgba(137, 37, 54, 0.22);
      border: 1px solid rgba(255, 91, 111, 0.25);
      color: #ffb9c2;
      font-size: 14px;
      line-height: 1.5;
    }

    /* SLIP HEADER */

    .slip-summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      padding: 13px;
      background: #0a1710;
      border-radius: 13px;
    }

    .summary-item {
      text-align: center;
      flex: 1;
    }

    .summary-value {
      display: block;
      font-size: 20px;
      font-weight: 800;
      color: #20d17b;
    }

    .summary-label {
      display: block;
      font-size: 11px;
      color: #829087;
      margin-top: 3px;
    }

    /* SELECTION */

    .selection {
      background: #0a1710;
      border: 1px solid #20362b;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
    }

      justify-content: space-between;
      gap: 10px;
      align
