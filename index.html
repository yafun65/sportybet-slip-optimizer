<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SportyBet Slip Optimizer</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #07140d;

  color:
    #ffffff;

  min-height: 100vh;

}

.container {

  width: 100%;

  max-width: 850px;

  margin: auto;

  padding: 25px 16px 60px;

}

.header {

  text-align: center;

  padding:
    25px 10px;

}

.logo {

  font-size: 42px;

}

h1 {

  margin:
    8px 0;

  font-size:
    30px;

}

.subtitle {

  color:
    #9db5a5;

  font-size:
    15px;

}

.card {

  background:
    #0d2116;

  border:
    1px solid #193c27;

  border-radius:
    14px;

  padding:
    20px;

  margin-top:
    18px;

}

label {

  display:
    block;

  margin-bottom:
    8px;

  font-weight:
    bold;

}

input {

  width:
    100%;

  padding:
    15px;

  border-radius:
    9px;

  border:
    1px solid #315b40;

  background:
    #07140d;

  color:
    white;

  font-size:
    16px;

  outline:
    none;

}

button {

  width:
    100%;

  margin-top:
    12px;

  padding:
    14px;

  border:
    none;

  border-radius:
    9px;

  background:
    #16a34a;

  color:
    white;

  font-size:
    16px;

  font-weight:
    bold;

  cursor:
    pointer;

}

button:disabled {

  opacity:
    0.5;

  cursor:
    not-allowed;

}

.secondary {

  background:
    #173522;

}

.status {

  margin-top:
    12px;

  color:
    #a9c3b1;

  font-size:
    14px;

}

.error {

  color:
    #ff7b7b;

}

.hidden {

  display:
    none;

}

.slip-row {

  padding:
    12px 0;

  border-bottom:
    1px solid #193c27;

}

.slip-row:last-child {

  border-bottom:
    none;

}

.event {

  font-weight:
    bold;

}

.market {

  color:
    #a9c3b1;

  margin-top:
    4px;

}

.pick {

  margin-top:
    4px;

}

.odds {

  color:
    #69d391;

  margin-top:
    4px;

}

.profile {

  border:
    1px solid #214d31;

  border-radius:
    12px;

  padding:
    16px;

  margin-top:
    16px;

}

.profile h3 {

  margin:
    0 0 6px;

}

.profile-summary {

  color:
    #a9c3b1;

  font-size:
    14px;

  margin-bottom:
    12px;

}

.code-box {

  background:
    #07140d;

  border:
    1px solid #315b40;

  border-radius:
    9px;

  padding:
    14px;

  margin-top:
    12px;

  text-align:
    center;

}

.code {

  font-size:
    24px;

  font-weight:
    bold;

  letter-spacing:
    2px;

}

.copy {

  margin-top:
    10px;

}

.small {

  font-size:
    13px;

  color:
    #8da895;

}

</style>

</head>


<body>


<div class="container">


  <div class="header">

    <div class="logo">
      ⚽
    </div>

    <h1>
      SportyBet Slip Optimizer
    </h1>

    <div class="subtitle">
      Analyze your slip and create different risk profiles.
    </div>

  </div>


  <!-- ============================================= -->
  <!-- LOAD SLIP -->
  <!-- ============================================= -->

  <div class="card">

    <label>
      SportyBet Booking Code
    </label>

    <input
      id="bookingCode"
      type="text"
      placeholder="e.g. GWF3U9"
      autocomplete="off"
    >

    <button
      id="analyzeBtn"
      onclick="loadSlip()"
    >
      Analyze Slip
    </button>

    <div
      id="loadStatus"
      class="status"
    ></div>

  </div>


  <!-- ============================================= -->
  <!-- ORIGINAL SLIP -->
  <!-- ============================================= -->

  <div
    id="slipCard"
    class="card hidden"
  >

    <h2>
      Your Slip
    </h2>

    <div
      id="slipCount"
      class="small"
    ></div>

    <div
      id="slipList"
    ></div>

    <button
      id="optimizeBtn"
      onclick="optimizeSlip()"
    >
      Optimize My Slip
    </button>

    <div
      id="optimizeStatus"
      class="status"
    ></div>

  </div>


  <!-- ============================================= -->
  <!-- RESULTS -->
  <!-- ============================================= -->

  <div
    id="resultsCard"
    class="card hidden"
  >

    <h2>
      Optimized Profiles
    </h2>

    <div
      id="results"
    ></div>

  </div>


</div>


<script>


let originalSelections = [];


// =====================================================
// LOAD SLIP
// =====================================================

async function loadSlip() {

  const input =
    document.getElementById("bookingCode");

  const code =
    input.value.trim().toUpperCase();

  const status =
    document.getElementById("loadStatus");

  const button =
    document.getElementById("analyzeBtn");


  if (!code) {

    status.innerHTML =
      `<span class="error">
        Enter a SportyBet booking code.
      </span>`;

    return;
  }


  button.disabled = true;

  button.textContent =
    "Loading...";

  status.textContent =
    "Loading your slip...";


  try {

    const response =
      await fetch(
        "/api/load-slip",
        {

          method:
            "POST",

          headers:
            {
              "Content-Type":
                "application/json"
            },

          body:
            JSON.stringify({
              code
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to load slip."
      );

    }


    originalSelections =
      data.selections || [];


    if (
      originalSelections.length === 0
    ) {

      throw new Error(
        "No selections were found."
      );

    }


    displayOriginalSlip();


    document
      .getElementById("slipCard")
      .classList
      .remove("hidden");


    status.textContent =
      `Loaded ${originalSelections.length} selections.`;


  } catch (error) {

    status.innerHTML =
      `<span class="error">
        ${escapeHtml(error.message)}
      </span>`;

  } finally {

    button.disabled = false;

    button.textContent =
      "Analyze Slip";

  }

}


// =====================================================
// DISPLAY ORIGINAL SLIP
// =====================================================

function displayOriginalSlip() {

  const list =
    document.getElementById("slipList");

  const count =
    document.getElementById("slipCount");


  count.textContent =
    `${originalSelections.length} selections`;


  list.innerHTML =
    originalSelections
      .map(selection => `

        <div class="slip-row">

          <div class="event">
            ${escapeHtml(selection.event)}
          </div>

          <div class="market">
            ${escapeHtml(selection.market)}
          </div>

          <div class="pick">
            ${escapeHtml(selection.pick)}
          </div>

          <div class="odds">
            Odds: ${selection.odds ?? "-"}
          </div>

        </div>

      `)
      .join("");

}


// =====================================================
// OPTIMIZE
// =====================================================

async function optimizeSlip() {

  const button =
    document.getElementById("optimizeBtn");

  const status =
    document.getElementById("optimizeStatus");


  button.disabled = true;

  button.textContent =
    "Optimizing...";

  status.textContent =
    "AI is analyzing your selections...";


  try {

    const response =
      await fetch(
        "/api/optimize",
        {

          method:
            "POST",

          headers:
            {
              "Content-Type":
                "application/json"
            },

          body:
            JSON.stringify({
              selections:
                originalSelections
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Optimization failed."
      );

    }


    displayResults(data);


    document
      .getElementById("resultsCard")
      .classList
      .remove("hidden");


    status.textContent =
      "Optimization complete.";


  } catch (error) {

    status.innerHTML =
      `<span class="error">
        ${escapeHtml(error.message)}
      </span>`;

  } finally {

    button.disabled = false;

    button.textContent =
      "Optimize My Slip";

  }

}


// =====================================================
// DISPLAY RESULTS
// =====================================================

function displayResults(data) {

  const container =
    document.getElementById("results");


  const profiles =
    ["SAFE", "BALANCED", "RISKY"];


  container.innerHTML =
    profiles
      .map(profile => {

        const result =
          data[profile];


        if (!result) {
          return "";
        }


        const selections =
          Array.isArray(result.selections)
            ? result.selections
            : [];


        return `

          <div class="profile">

            <h3>
              ${profile}
            </h3>

            <div class="profile-summary">
              ${escapeHtml(
                result.summary || ""
              )}
            </div>

            ${
              selections
                .map(selection => `

                  <div class="slip-row">

                    <div class="event">
                      ${escapeHtml(
                        selection.event || ""
                      )}
                    </div>

                    <div class="market">
                      ${escapeHtml(
                        selection.market || ""
                      )}
                    </div>

                    <div class="pick">
                      ${escapeHtml(
                        selection.pick || ""
                      )}
                    </div>

                    <div class="odds">
                      Odds:
                      ${selection.odds ?? "-"}
                    </div>

                  </div>

                `)
                .join("")
            }


            <button
              onclick="generateBooking(
                '${profile}'
              )"
            >
              Generate SportyBet Code
            </button>


            <div
              id="code-${profile}"
              class="code-box hidden"
            >

              <div class="small">
                SportyBet Booking Code
              </div>

              <div
                id="code-value-${profile}"
                class="code"
              ></div>

              <button
                class="secondary copy"
                onclick="copyCode(
                  '${profile}'
                )"
              >
                Copy Code
              </button>

              <div
                id="code-link-${profile}"
                class="small"
              ></div>

            </div>


            <div
              id="status-${profile}"
              class="status"
            ></div>

          </div>

        `;

      })
      .join("");

}


// =====================================================
// GENERATE SPORTYBET BOOKING
// =====================================================

async function generateBooking(profile) {

  const status =
    document.getElementById(
      `status-${profile}`
    );

  const codeBox =
    document.getElementById(
      `code-${profile}`
    );


  const profileData =
    window.optimizedData?.[profile];


  if (!profileData) {

    status.innerHTML =
      `<span class="error">
        Optimization data not found.
      </span>`;

    return;
  }


  const selections =
    profileData.selections || [];


  if (selections.length === 0) {

    status.innerHTML =
      `<span class="error">
        This profile has no selections.
      </span>`;

    return;
  }


  status.textContent =
    "Checking selections with SportyBet...";


  try {

    const response =
      await fetch(
        "https://sportybet-api.onrender.com/create-booking",
        {

          method:
            "POST",

          headers:
            {
              "Content-Type":
                "application/json"
            },

          body:
            JSON.stringify({
              selections
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "SportyBet could not create this booking."
      );

    }


    if (!data.shareCode) {

      throw new Error(
        "SportyBet did not return a booking code."
      );

    }


    document
      .getElementById(
        `code-value-${profile}`
      )
      .textContent =
      data.shareCode;


    if (data.shareURL) {

      document
        .getElementById(
          `code-link-${profile}`
        )
        .innerHTML =
        `<br>
        <a
          href="${escapeAttribute(
            data.shareURL
          )}"
          target="_blank"
          style="color:#69d391"
        >
          Open SportyBet Slip
        </a>`;

    }


    codeBox
      .classList
      .remove("hidden");


    status.textContent =
      "Booking code created successfully.";


  } catch (error) {

    status.innerHTML =
      `<span class="error">
        ${escapeHtml(error.message)}
      </span>`;

  }

}


// =====================================================
// COPY CODE
// =====================================================

async function copyCode(profile) {

  const value =
    document
      .getElementById(
        `code-value-${profile}`
      )
      .textContent;


  try {

    await navigator.clipboard.writeText(
      value
    );


    alert(
      "Booking code copied."
    );

  } catch {

    alert(
      `Booking code: ${value}`
    );

  }

}


// =====================================================
// SECURITY HELPERS
// =====================================================

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


// =====================================================
// STORE OPTIMIZATION DATA
// =====================================================

// We wrap the original displayResults function so
// the complete AI result is available to the
// Generate SportyBet Code buttons.

const originalDisplayResults =
  displayResults;


displayResults =
  function(data) {

    window.optimizedData =
      data;

    originalDisplayResults(data);

  };


</script>

</body>

</html>
