<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportyBet Selection Optimizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #07130f;
      color: #f5fff8;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 20px 14px 40px;
    }

    .header {
      text-align: center;
      padding: 15px 5px 25px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #9fb5aa;
      font-size: 14px;
    }

    .card {
      background: #0d2119;
      border: 1px solid #1c3a2d;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #b8c9c1;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #315142;
      background: #081710;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 10px;
      padding: 12px 15px;
      border: 0;
      border-radius: 10px;
      background: #21a85a;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #17372a;
      border: 1px solid #2a5540;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 11px;
      border-radius: 9px;
      background: #091a13;
      color: #a9c0b5;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #ffaaa8;
      border: 1px solid #6b302e;
    }

    .status.success {
      color: #9cf0bc;
      border: 1px solid #245d3d;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .selection {
      padding: 12px;
      margin-bottom: 9px;
      background: #091912;
      border: 1px solid #1b382c;
      border-radius: 12px;
    }

    .event {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .market {
      color: #b9c9c1;
      font-size: 13px;
      line-height: 1.5;
    }

    .odds {
      margin-top: 7px;
      color: #7ee7a5;
      font-weight: bold;
    }

    .profiles {
      display: grid;
      gap: 12px;
    }

    .profile {
      padding: 15px;
      background: #0a1b14;
      border: 1px solid #234737;
      border-radius: 14px;
    }

    .profile-name {
      font-size: 17px;
      font-weight: bold;
    }

    .small {
      color: #829a8e;
      font-size: 12px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: #9cf0bc;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>SportyBet Selection Optimizer</h1>
    <p>Load your selections and let AI create different ways to approach the ticket.</p>
  </div>

  <!-- LOAD -->
  <div class="card">

    <label for="bookingCode">
      SportyBet Booking Code
    </label>

    <input
      id="bookingCode"
      type="text"
      placeholder="Enter booking code e.g. JQVHY8"
    >

    <button id="loadBtn">
      Load SportyBet Selections
    </button>

    <div id="loadStatus" class="status"></div>

  </div>


  <!-- SELECTIONS -->
  <div id="selectionsCard" class="card hidden">

    <h2 class="section-title">
      Your Selections
    </h2>

    <div id="selectionList"></div>

    <button id="analyzeBtn" class="secondary">
      Analyze Selections
    </button>

    <button id="optimizeBtn">
      Optimize My Selections
    </button>

    <div id="optimizeStatus" class="status"></div>

  </div>


  <!-- RESULTS -->
  <div id="resultsCard" class="card hidden">

    <h2 class="section-title">
      Optimized Selections
    </h2>

    <div id="profiles" class="profiles"></div>

  </div>


  <!-- DEBUG -->
  <div id="debugCard" class="card hidden">

    <h2 class="section-title">
      Optimizer Response
    </h2>

    <pre id="debugOutput"></pre>

  </div>

</div>


<script>

  // ==========================================================
  // MAIN STATE
  // ==========================================================

  let currentSelections = [];

  let optimizationResults = {};

  let selectedProfile = "SAFE";


  // ==========================================================
  // ELEMENTS
  // ==========================================================

  const bookingCode =
    document.getElementById("bookingCode");

  const loadBtn =
    document.getElementById("loadBtn");

  const analyzeBtn =
    document.getElementById("analyzeBtn");

  const optimizeBtn =
    document.getElementById("optimizeBtn");

  const loadStatus =
    document.getElementById("loadStatus");

  const optimizeStatus =
    document.getElementById("optimizeStatus");

  const selectionsCard =
    document.getElementById("selectionsCard");

  const selectionList =
    document.getElementById("selectionList");

  const resultsCard =
    document.getElementById("resultsCard");

  const profiles =
    document.getElementById("profiles");

  const debugCard =
    document.getElementById("debugCard");

  const debugOutput =
    document.getElementById("debugOutput");


  // ==========================================================
  // STATUS
  // ==========================================================

  function status(element, message, type) {

    element.textContent = message;

    element.className =
      "status show " +
      (type || "");
  }


  // ==========================================================
  // EXTRACT SELECTIONS
  // ==========================================================

  function extractSelections(data) {

    const possibilities = [

      data?.selections,

      data?.booking?.selections,

      data?.data?.selections,

      data?.booking?.data?.selections,

      data?.booking?.data?.outcomes,

      data?.data?.outcomes

    ];

    for (const item of possibilities) {

      if (
        Array.isArray(item) &&
        item.length > 0
      ) {

        return item;

      }

    }

    return [];

  }


  // ==========================================================
  // NORMALIZE
  // ==========================================================

  function normalizeSelection(item) {

    return {

      event:
        item?.event ||
        item?.eventName ||
        "Unknown event",

      market:
        item?.market ||
        item?.marketName ||
        "Unknown market",

      pick:
        item?.pick ||
        item?.outcome ||
        item?.outcomeName ||
        "Unknown pick",

      odds:
        Number(item?.odds || 0),

      eventId:
        item?.eventId ||
        item?.event_id ||
        "",

      gameId:
        item?.gameId ||
        item?.game_id ||
        "",

      marketId:
        item?.marketId ||
        item?.market_id ||
        "",

      specifier:
        item?.specifier ??
        null,

      outcomeId:
        item?.outcomeId ||
        item?.outcome_id ||
        "",

      startTime:
        item?.startTime ||
        item?.start_time ||
        null

    };

  }


  // ==========================================================
  // LOAD SPORTYBET
  // ==========================================================

  loadBtn.addEventListener(
    "click",
    async function() {

      const code =
        bookingCode.value.trim();

      if (!code) {

        status(
          loadStatus,
          "Enter a SportyBet booking code first.",
          "error"
        );

        return;
      }

      loadBtn.disabled = true;

      loadBtn.textContent =
        "Loading...";

      currentSelections = [];

      resultsCard.classList.add(
        "hidden"
      );

      debugCard.classList.add(
        "hidden"
      );

      try {

        const response =
          await fetch(
            "/api/load-slip",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                code: code
              })
            }
          );

        const text =
          await response.text();

        let data;

        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "Invalid response from /api/load-slip."
          );

        }

        if (!response.ok) {

          throw new Error(
            data?.error ||
            "Could not load the booking."
          );

        }

        const raw =
          extractSelections(data);

        currentSelections =
          raw
            .map(normalizeSelection)
            .filter(
              x =>
                x.eventId &&
                x.marketId &&
                x.outcomeId
            );

        if (
          currentSelections.length === 0
        ) {

          throw new Error(
            "The booking loaded, but no valid selections were found."
          );

        }

        renderSelections();

        selectionsCard.classList.remove(
          "hidden"
        );

        status(
          loadStatus,
          currentSelections.length +
          " selections loaded successfully.",
          "success"
        );

      } catch (error) {

        status(
          loadStatus,
          error?.message ||
          "Loading failed.",
          "error"
        );

      } finally {

        loadBtn.disabled = false;

        loadBtn.textContent =
          "Load SportyBet Selections";

      }

    }
  );


  // ==========================================================
  // DISPLAY SELECTIONS
  // ==========================================================

  function renderSelections() {

    selectionList.innerHTML = "";

    currentSelections.forEach(
      function(selection, index) {

        const div =
          document.createElement("div");

        div.className =
          "selection";

        div.innerHTML = `

          <div class="event">
            ${index + 1}.
            ${escapeHtml(selection.event)}
          </div>

          <div class="market">
            ${escapeHtml(selection.market)}
            —
            <strong>
              ${escapeHtml(selection.pick)}
            </strong>
          </div>

          <div class="odds">
            Odds:
            ${
              selection.odds > 0
                ? selection.odds.toFixed(2)
                : "-"
            }
          </div>

        `;

        selectionList.appendChild(
          div
        );

      }
    );

  }


  // ==========================================================
  // ANALYZE
  // ==========================================================

  analyzeBtn.addEventListener(
    "click",
    function() {

      if (
        currentSelections.length === 0
      ) {

        status(
          optimizeStatus,
          "Load your selections first.",
          "error"
        );

        return;
      }

      status(
        optimizeStatus,
        currentSelections.length +
        " selections are ready for optimization.",
        "success"
      );

    }
  );


  // ==========================================================
  // OPTIMIZE
  // ==========================================================

  optimizeBtn.addEventListener(
    "click",
    async function() {

      if (
        currentSelections.length === 0
      ) {

        status(
          optimizeStatus,
          "There are no selections to optimize.",
          "error"
        );

        return;
      }

      optimizeBtn.disabled = true;

      optimizeBtn.textContent =
        "Optimizing...";

      debugCard.classList.add(
        "hidden"
      );

      try {

        // THIS IS THE IMPORTANT PART.
        // The exact loaded selections are sent here.

        const payload = {
          selections:
            currentSelections
        };

        console.log(
          "OPTIMIZE PAYLOAD:",
          payload
        );

        const response =
          await fetch(
            "/api/optimize",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );

        const text =
          await response.text();

        let data;

        try {

          data =
            JSON.parse(text);

        } catch {

          data = {
            rawResponse: text
          };

        }


        // SHOW EXACT SERVER RESPONSE

        debugCard.classList.remove(
          "hidden"
        );

        debugOutput.textContent =
          JSON.stringify(
            data,
            null,
            2
          );


        // Check HTTP status

        if (!response.ok) {

          throw new Error(
            data?.error ||
            data?.message ||
            "Optimizer request failed."
          );

        }


        // Check for profiles

        optimizationResults =
          data?.profiles ||
          data ||
          {};

        const hasProfiles =
          [
            "SAFE",
            "BALANCED",
            "RISKY",
            "AI RECOMMENDED"
          ].some(
            name =>
              optimizationResults?.[name]
          );


        if (!hasProfiles) {

          resultsCard.classList.remove(
            "hidden"
          );

          profiles.innerHTML = `
            <div class="selection">
              <div class="event">
                No profiles returned yet.
              </div>

              <div class="market">
                The exact response from the optimizer
                is shown below.
              </div>
            </div>
          `;

          status(
            optimizeStatus,
            "Diagnostic response received.",
            "success"
          );

          return;

        }


        // NORMAL PROFILE DISPLAY

        renderProfiles();

        resultsCard.classList.remove(
          "hidden"
        );

        status(
          optimizeStatus,
          "Optimization complete.",
          "success"
        );

      } catch (error) {

        console.error(error);

        status(
          optimizeStatus,
          error?.message ||
          "Optimization failed.",
          "error"
        );

      } finally {

        optimizeBtn.disabled = false;

        optimizeBtn.textContent =
          "Optimize My Selections";

      }

    }
  );


  // ==========================================================
  // RENDER PROFILES
  // ==========================================================

  function renderProfiles() {

    profiles.innerHTML = "";

    const names = [
      "SAFE",
      "BALANCED",
      "RISKY",
      "AI RECOMMENDED"
    ];

    names.forEach(
      function(name) {

        const profile =
          optimizationResults?.[name];

        if (!profile) {
          return;
        }

        const selections =
          Array.isArray(
            profile.selections
          )
            ? profile.selections
            : [];

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "profile";

        card.innerHTML = `

          <div class="profile-name">
            ${escapeHtml(name)}
          </div>

          <div class="small">
            ${
              selections.length
            } selections
          </div>

          <div class="small">
            ${
              escapeHtml(
                profile.summary ||
                ""
              )
            }
          </div>

        `;

        profiles.appendChild(
          card
        );

      }
    );

  }


  // ==========================================================
  // ESCAPE HTML
  // ==========================================================

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
</html>
